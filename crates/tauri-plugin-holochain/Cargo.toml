[package]
name = "tauri-plugin-holochain"
version = "0.2.2"
exclude = ["/examples", "/node_modules"]
links = "tauri-plugin-holochain"
description = "Tauri plugin that runs an in-process Holochain conductor (FFI-free, desktop + mobile)"
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The wasm backend (cranelift vs. wasmi on iOS) is selected by target cfg in
# holochain-conductor-runtime's Cargo.toml and unifies across the graph.
holochain-conductor-runtime = { path = "../runtime", version = "0.2.2" }
holochain-conductor-runtime-types-ffi = { path = "../runtime-types-ffi", version = "0.2.2" }
holochain = { workspace = true, features = ["encryption", "schema"] }
lair_keystore_api = { workspace = true }
sodoken = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
holochain = { workspace = true }
holochain_types = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
