[package]
name = "tauri-plugin-holochain"
version = "0.3.0"
exclude = ["/examples", "/node_modules"]
links = "tauri-plugin-holochain"
description = "Tauri plugin that runs an in-process Holochain conductor (FFI-free, desktop + mobile)"
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
holochain-conductor-runtime = { path = "../runtime", version = "0.3.0" }
holochain-conductor-runtime-types-ffi = { path = "../runtime-types-ffi", version = "0.3.0" }
holochain = { workspace = true }
lair_keystore_api = { workspace = true }
sodoken = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }

[features]
test-utils = ["tauri/test"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
holochain = { workspace = true }
holochain_types = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
# Self-dependency: what turns `test-utils` on for this crate's own test targets.
tauri-plugin-holochain = { path = ".", features = ["test-utils"] }
