[package]
name = "holochain-conductor-runtime"
version = "0.3.0"
edition = "2021"


[lib]
crate-type = ["lib"]
name = "holochain_conductor_runtime"


[features]
default = ["wasm-jit"]
# Cranelift JIT: holochain's default engine (Android, desktop).
wasm-jit = ["holochain/wasmer-sys-cranelift"]
# wasmi interpreter: for iOS, where App Store apps can't map writable+executable memory.
wasm-interpreter = ["holochain/wasmer-wasmi"]

[dependencies]
# holochain = { workspace = true }
holochain = { workspace = true, features = ["encryption", "schema"] }
holochain_types = { workspace = true }
holochain_keystore = "0.7.0"
kitsune2_api = { workspace = true }
lair_keystore_api = { workspace = true }
# hc-auth: HTTP challenge/authenticate against the auth server + base64 material.
# rustls-tls to match the workspace's rustls/aws-lc crypto stack (no native-tls).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = { workspace = true }
sodoken = { workspace = true }
url2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
